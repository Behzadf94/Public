    <section class="fragment">
      <h2 class="section-title">۱. خلاصه مدیریتی</h2>
      <p class="text-sm leading-8 text-slate-700">
        این کد یک ابزار دسکتاپ ویندوزی برای یادآوری و اعمال وقفه استراحت است. برنامه تنها یک نمونه فعال در کل سیستم اجرا می‌کند،
        خود را در Startup ویندوز ثبت می‌کند، از طریق Tray در دسترس است، در بازه‌های زمانی تنظیم‌شده صفحه استراحت را فعال می‌کند،
        ورودی‌های خاص صفحه‌کلید را در زمان استراحت محدود می‌سازد، مانیتورهای غیر اصلی را با پنجره‌های مشکی می‌پوشاند و روی مانیتور اصلی
        یک فرم قفل/اسکرین‌سیور متحرک با ساعت، تاریخ شمسی، کاربر و زمان باقی‌مانده نمایش می‌دهد.
      </p>
      <div class="grid grid-cols-2 gap-3 mt-3 text-xs">
        <div class="rounded-xl bg-slate-50 border border-slate-200 p-3">
          <div class="font-extrabold text-slate-900 mb-1">منابع تحلیل</div>
          <ul class="list-disc pr-5 leading-6 text-slate-600">
            <li>Program.cs / Main و RegisterInStartup</li>
            <li>BreakApplicationContext.cs / TimerTick، StartBreak، EndBreak، OpenInlineSettings</li>
            <li>ExplorerWatcher.cs / Start، CheckExplorer، IsExplorerRunning</li>
            <li>LockScreenManager.cs / Show و Hide</li>
            <li>BreakScreenSaverControl.cs / StepAndInvalidate، OnPaint، DrawNeonInfoText</li>
            <li>PersianDateService.cs / NowPersianDateString</li>
          </ul>
        </div>
        <div class="rounded-xl bg-amber-50 border border-amber-200 p-3">
          <div class="font-extrabold text-amber-900 mb-1">نکته دامنه داده</div>
          <p class="leading-6 text-amber-800">
            هیچ اتصال پایگاه داده، Query، جدول SQL یا Entity پایدار دیتابیسی در کد ارائه‌شده مشاهده نمی‌شود.
            ذخیره‌سازی تنظیمات از طریق <span class="ltr">Settings.Load()</span> و <span class="ltr">Settings.Save()</span>
            فراخوانی شده اما کلاس Settings در ورودی موجود نیست؛ همچنین ثبت Startup از طریق Registry ویندوز انجام می‌شود.
          </p>
        </div>
      </div>
    </section>

                <li>در خروج برنامه، TrayIcon مخفی، Hook آزاد، Watcher متوقف و فرم‌های قفل بسته می‌شوند.</li>
                <li>در صورت ثبت موفق Startup، برنامه در اجرای بعدی ویندوز به‌صورت خودکار آغاز می‌شود.</li>

    <section class="fragment">
      <h2 class="section-title">۳. جریان اصلی Use Case</h2>
      <ol class="list-decimal pr-6 text-sm leading-8 text-slate-700">
        <li>کاربر یا سیستم‌عامل برنامه BehzadRest را اجرا می‌کند.</li>
        <li>برنامه با Mutex سراسری بررسی می‌کند که نمونه دیگری از برنامه در کل سیستم فعال نباشد.</li>
        <li>در صورت نبود نمونه فعال، تنظیمات WinForms مقداردهی و برنامه برای اجرای خودکار در Startup ویندوز ثبت می‌شود.</li>
        <li>Context اصلی برنامه ساخته می‌شود و Tray Menu شامل Settings، Start Break، End Break و Exit فعال می‌گردد.</li>
        <li>Keyboard Hook نصب می‌شود تا میانبر پایان وقفه، به‌ویژه F2، قابل کنترل باشد.</li>
        <li>پایش Explorer شروع می‌شود تا در صورت ری‌استارت شدن Explorer، Hook مجدداً نصب شود.</li>
        <li>تنظیمات فاصله وقفه بارگذاری و زمان وقفه بعدی محاسبه می‌شود.</li>
        <li>Timer هر ثانیه وضعیت را کنترل می‌کند و متن Tray را با زمان باقی‌مانده تا وقفه یا پایان وقفه به‌روزرسانی می‌کند.</li>
        <li>وقتی زمان وقفه فرا برسد، وضعیت وقفه فعال می‌شود، مسدودسازی Keyboard Hook روشن می‌گردد و زمان پایان وقفه محاسبه می‌شود.</li>
        <li>روی مانیتورهای غیر اصلی پنجره‌های سیاه تمام‌صفحه باز می‌شود و روی مانیتور اصلی فرم قفل/استراحت نمایش داده می‌شود.</li>
        <li>کنترل گرافیکی اسکرین‌سیور با نرخ تقریباً ۶۰ فریم بر ثانیه ساعت نئونی، تاریخ شمسی، نام کاربر و زمان باقی‌مانده را نمایش می‌دهد.</li>
        <li>با پایان زمان وقفه یا اجرای فرمان پایان وقفه، فرم‌ها بسته، Hook آزاد و زمان وقفه بعدی محاسبه می‌شود.</li>
      </ol>
    </section>

  <script>
    const useCaseState = {
      meta: {
        generatedAtGregorian: "2026-08-02",
        generatedAtJalali: "1405/05/11",
        systemName: "BehzadRest / T2B",
        sourceFiles: [
          "Program.cs",
          "BreakApplicationContext.cs",
          "BreakLockForm.cs",
          "BreakLockForm.Designer.cs",
          "BreakScreenSaverControl.cs",
          "ExplorerWatcher.cs",
          "LockScreenManager.cs",
          "PersianDateService.cs"
        ],
        ownerFooter: "مالک معنوی سورس‌کد: شرکت طرح اندیشان پویا"
      },
      useCases: [
        {
          id: "U101",
          technicalName: "Enforce Scheduled User Break Lock",
          suggestedPersianName: "مدیریت اجباری وقفه استراحت کاربر در ویندوز",
          userEditedName: "مدیریت اجباری وقفه استراحت کاربر در ویندوز"
        }
      ],
      entities: [
        { id: "Program._globalMutex", technicalName: "_globalMutex", suggestedPersianName: "قفل اجرای تک‌نمونه‌ای برنامه", userEditedName: "قفل اجرای تک‌نمونه‌ای برنامه" },
        { id: "Registry.BehzadRest", technicalName: "BehzadRest Run Key", suggestedPersianName: "ثبت اجرای خودکار برنامه", userEditedName: "ثبت اجرای خودکار برنامه" },
        { id: "Settings.BreakInterval", technicalName: "BreakInterval", suggestedPersianName: "فاصله زمانی بین وقفه‌ها", userEditedName: "فاصله زمانی بین وقفه‌ها" },
        { id: "Settings.BreakDuration", technicalName: "BreakDuration", suggestedPersianName: "مدت زمان وقفه استراحت", userEditedName: "مدت زمان وقفه استراحت" },
        { id: "BreakApplicationContext._nextBreak", technicalName: "_nextBreak", suggestedPersianName: "زمان شروع وقفه بعدی", userEditedName: "زمان شروع وقفه بعدی" },
        { id: "BreakApplicationContext._breakEnd", technicalName: "_breakEnd", suggestedPersianName: "زمان پایان وقفه جاری", userEditedName: "زمان پایان وقفه جاری" },
        { id: "BreakApplicationContext._isBreakActive", technicalName: "_isBreakActive", suggestedPersianName: "وضعیت فعال بودن وقفه", userEditedName: "وضعیت فعال بودن وقفه" },
        { id: "ExplorerWatcher._wasRunning", technicalName: "_wasRunning", suggestedPersianName: "وضعیت قبلی اجرای Explorer", userEditedName: "وضعیت قبلی اجرای Explorer" },
        { id: "BreakScreenSaverControl.motion", technicalName: "_pos / _vel", suggestedPersianName: "موقعیت و سرعت بلوک نمایشی استراحت", userEditedName: "موقعیت و سرعت بلوک نمایشی استراحت" },
        { id: "PersianDateService.NowPersianDateString", technicalName: "NowPersianDateString()", suggestedPersianName: "تاریخ شمسی روز جاری", userEditedName: "تاریخ شمسی روز جاری" }
      ]
    };

    let pages = [];
    let currentPage = 0;

    function updateBusinessName(input) {
      const kind = input.dataset.kind;
      const id = input.dataset.id;
      const value = input.value;

      if (kind === "useCase") {
        const item = useCaseState.useCases.find(x => x.id === id);
        if (item) item.userEditedName = value;
      }

      if (kind === "entity") {
        const item = useCaseState.entities.find(x => x.id === id);
        if (item) item.userEditedName = value;
      }
    }

    function exportState() {
      const blob = new Blob([JSON.stringify(useCaseState, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "useCaseState_U101.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function makePage(contentHtml, pageNo) {
      const page = document.createElement("div");
      page.className = "a4-page";
      page.innerHTML = `
        <div class="page-inner">${contentHtml}</div>
        <div class="page-footer">
          <span>مالک معنوی سورس‌کد: شرکت طرح اندیشان پویا</span>
          <span>صفحه ${pageNo}</span>
        </div>
      `;
      return page;
    }

    function paginate() {
      const host = document.getElementById("pageHost");
      const template = document.getElementById("reportFragments");
      const fragments = Array.from(template.content.children).map(x => x.cloneNode(true));
      const probeInner = document.getElementById("probeInner");

      host.innerHTML = "";
      pages = [];
      let currentFragments = [];

      const maxHeight = probeInner.clientHeight || 930;

      fragments.forEach(fragment => {
        currentFragments.push(fragment.outerHTML);
        probeInner.innerHTML = currentFragments.join("");

        if (probeInner.scrollHeight > maxHeight) {
          currentFragments.pop();
          pages.push(currentFragments.join(""));
          currentFragments = [fragment.outerHTML];
          probeInner.innerHTML = currentFragments.join("");
        }
      });

      if (currentFragments.length > 0) pages.push(currentFragments.join(""));

      pages.forEach((html, idx) => {
        const page = makePage(html, idx + 1);
        if (idx !== 0) page.style.display = "none";
        host.appendChild(page);
      });

      currentPage = 0;
      updateNav();
      setTimeout(drawUseCaseDiagram, 100);
    }

    function showPage(index) {
      const pageEls = Array.from(document.querySelectorAll("#pageHost .a4-page"));
      pageEls.forEach((p, i) => p.style.display = i === index ? "block" : "none");
      currentPage = index;
      updateNav();
      setTimeout(drawUseCaseDiagram, 100);
    }

    function nextPage() {
      if (currentPage < pages.length - 1) showPage(currentPage + 1);
    }

    function prevPage() {
      if (currentPage > 0) showPage(currentPage - 1);
    }

    function updateNav() {
      document.getElementById("pageCounter").textContent = `صفحه ${currentPage + 1} از ${pages.length}`;
      document.getElementById("prevBtn").disabled = currentPage === 0;
      document.getElementById("nextBtn").disabled = currentPage === pages.length - 1;
    }

    function drawActor(ctx, x, y, label) {
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x, y + 18);
      ctx.lineTo(x, y + 88);
      ctx.moveTo(x - 38, y + 44);
      ctx.lineTo(x + 38, y + 44);
      ctx.moveTo(x, y + 88);
      ctx.lineTo(x - 34, y + 138);
      ctx.moveTo(x, y + 88);
      ctx.lineTo(x + 34, y + 138);
      ctx.stroke();

      ctx.font = "bold 18px Arial";
      ctx.fillStyle = "#111827";
      ctx.textAlign = "center";
      ctx.fillText(label, x, y + 168);
    }

    function drawOval(ctx, x, y, w, h, text) {
      ctx.beginPath();
      ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#eff6ff";
      ctx.fill();
      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = "#1e3a8a";
      ctx.font = "bold 15px Arial";
      ctx.textAlign = "center";

      const words = text.split(" ");
      let line = "";
      const lines = [];
      words.forEach(word => {
        const test = line + word + " ";
        if (ctx.measureText(test).width > w - 26 && line) {
          lines.push(line.trim());
          line = word + " ";
        } else {
          line = test;
        }
      });
      lines.push(line.trim());

      const startY = y - ((lines.length - 1) * 18) / 2;
      lines.forEach((l, i) => ctx.fillText(l, x, startY + i * 18));
    }

    function drawLine(ctx, x1, y1, x2, y2) {
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawUseCaseDiagram() {
      const canvas = document.getElementById("useCaseCanvas");
      if (!canvas) return;

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#0f172a";
      ctx.font = "bold 24px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Use Case Diagram - BehzadRest Break Enforcement", canvas.width / 2, 38);

      drawActor(ctx, 90, 125, "Windows User");

      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 2.5;
      ctx.strokeRect(250, 70, 560, 345);

      ctx.fillStyle = "#334155";
      ctx.font = "bold 18px Arial";
      ctx.textAlign = "center";
      ctx.fillText("BehzadRest / T2B System", 530, 96);

      drawOval(ctx, 505, 145, 250, 58, "Run Single Instance");
      drawOval(ctx, 505, 220, 250, 58, "Register Windows Startup");
      drawOval(ctx, 505, 295, 250, 58, "Start Scheduled Break");
      drawOval(ctx, 505, 370, 250, 58, "End Break and Reset Timer");

      drawOval(ctx, 690, 255, 190, 54, "Monitor Explorer Restart");
      drawOval(ctx, 325, 255, 190, 54, "Edit Break Settings");

      drawLine(ctx, 130, 170, 380, 145);
      drawLine(ctx, 130, 185, 380, 220);
      drawLine(ctx, 130, 200, 380, 295);
      drawLine(ctx, 130, 215, 380, 370);
      drawLine(ctx, 130, 230, 230, 255);

      ctx.setLineDash([8, 6]);
      drawLine(ctx, 620, 295, 690, 282);
      drawLine(ctx, 390, 255, 315, 255);
      ctx.setLineDash([]);

      ctx.fillStyle = "#475569";
      ctx.font = "12px Arial";
      ctx.fillText("Keyboard Hook / Tray / Timer / Multi-Monitor Lock", 530, 438);
    }

    function saveDiagram() {
      const canvas = document.getElementById("useCaseCanvas");
      if (!canvas) return;

      const temp = document.createElement("canvas");
      temp.width = canvas.width;
      temp.height = canvas.height;
      const tctx = temp.getContext("2d");
      tctx.fillStyle = "#ffffff";
      tctx.fillRect(0, 0, temp.width, temp.height);
      tctx.drawImage(canvas, 0, 0);

      const link = document.createElement("a");
      link.download = "Image+useCase.jpg";
      link.href = temp.toDataURL("image/jpeg", 0.92);
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    window.addEventListener("load", paginate);
    window.addEventListener("resize", () => {
      clearTimeout(window.__paginateTimer);
      window.__paginateTimer = setTimeout(paginate, 250);
    });
  </script>
